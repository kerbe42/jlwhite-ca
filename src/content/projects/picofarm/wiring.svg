<!-- analog level to A2 -->
<circle cx="186" cy="468" r="5" fill="#fff" stroke="#2f6690" stroke-width="2.5"/>
<line x1="191" y1="468" x2="300" y2="468" class="sg"/>
<text x="196" y="459">level</text>

