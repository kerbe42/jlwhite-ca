<text x="650" y="280" class="c m">WROOM-32</text>
<text x="590" y="312" class="c">VIN</text>
<text x="700" y="312" class="c">3V3</text>
<text x="700" y="896" class="c">GND</text>
<g>
<text x="550" y="353">GPIO21</text>
<text x="550" y="398">GPIO22</text>
