<circle cx="400" cy="885" r="5" class="dot"/>
<line x1="400" y1="885" x2="400" y2="893" class="gs"/>
<rect x="392" y="893" width="16" height="24" class="res"/>
<path d="M400 917 V922 M388 922 H412 M392 927 H408 M396 932 H404" class="gs"/>
