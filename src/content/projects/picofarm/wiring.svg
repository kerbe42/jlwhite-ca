<line x1="760" y1="730" x2="830" y2="730" class="sg"/><rect x="830" y="710" width="150" height="40" rx="7" class="box"/><text x="905" y="738" class="c">MOSFET</text>
<line x1="980" y1="730" x2="1030" y2="730" class="pu"/><rect x="1030" y="710" width="160" height="40" rx="7" fill="#fdf0e1" stroke="#d07a1a" stroke-width="2.5"/><text x="1110" y="738" class="c">Circulation</text>
<line x1="1190" y1="730" x2="1266" y2="730" class="pw"/>

<line x1="760" y1="800" x2="830" y2="800" class="sg"/><rect x="830" y="780" width="150" height="40" rx="7" class="box"/><text x="905" y="808" class="c">MOSFET</text>
<line x1="980" y1="800" x2="1030" y2="800" class="pu"/><rect x="1030" y="780" width="160" height="40" rx="7" fill="#fdf0e1" stroke="#d07a1a" stroke-width="2.5"/><text x="1110" y="808" class="c">Drain</text>
<line x1="1190" y1="800" x2="1266" y2="800" class="pw"/>
</g>
<text x="918" y="870" class="m">sources to the star ground</text>
<text x="918" y="904" class="m">S3 boards use their own pin map</text>
</svg>
