<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="960" viewBox="0 0 1312 960" role="img" aria-labelledby="t d">
<title id="t">PicoFarm controller wiring (ESP32-WROOM-32)</title>
<desc id="d">An ESP32-WROOM-32 with an ADS1115 on I2C (GPIO21 and 22) reading the pH board through a 10k/20k divider on A0, the EC board on A1 (powered from GPIO13) and an analog level sensor on A2; a DS18B20 on GPIO4 with a 4.7k pull-up; low, high and emergency floats on GPIO32, 33 and 25; a leak sensor on GPIO35 with a 10k pull-up; an ultrasonic level sensor on GPIO14 and 34 through a 1k/2k divider; seven MOSFET pump drivers on GPIO16, 17, 18, 19, 23, 26 and 27; a 12 V supply through a 5 A fuse to the pump rail and a buck converter to 5 V; one star ground.</desc>
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-size:24px;fill:#2c2c2a}
.ti{font-family:Georgia,'Liberation Serif','Times New Roman',serif;font-size:34px}
.b{font-weight:700}
.m{fill:#5f5e5a}
.r{fill:#a8321f}
.c{text-anchor:middle}
.e{text-anchor:end}
.pw{stroke:#c0392b;stroke-width:4;fill:none}
.gn{stroke:#2c2c2a;stroke-width:4;fill:none}
.gs{stroke:#2c2c2a;stroke-width:2.5;fill:none}
.sg{stroke:#2f6690;stroke-width:3;fill:none}
.i2{stroke:#3f8a2e;stroke-width:3.5;fill:none}
.pu{stroke:#d07a1a;stroke-width:4;fill:none}
.box{fill:#fff;stroke:#d6cbb6;stroke-width:2}
.res{fill:#fff;stroke:#2c2c2a;stroke-width:2.5}
.dot{fill:#2c2c2a}
</style>
<rect width="1312" height="960" fill="#fbf7ef"/>

<!-- title and legend -->
<text x="30" y="54" class="ti">Controller wiring · ESP32-WROOM-32</text>
<line x1="700" y1="45" x2="734" y2="45" class="pw"/><text x="742" y="53">power</text>
<line x1="830" y1="45" x2="864" y2="45" class="gn"/><text x="872" y="53">ground</text>
<line x1="966" y1="45" x2="1000" y2="45" class="sg"/><text x="1008" y="53">signal</text>
<line x1="1088" y1="45" x2="1122" y2="45" class="i2"/><text x="1130" y="53">I²C</text>
<line x1="1182" y1="45" x2="1216" y2="45" class="pu"/><text x="1224" y="53">pump</text>

<!-- power: supply, fuse, +12 V rail, buck -->
<rect x="30" y="86" width="170" height="48" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="115" y="118" class="c b">12 V supply</text>
<line x1="200" y1="110" x2="240" y2="110" class="pw"/>
<rect x="240" y="94" width="110" height="32" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="295" y="118" class="c">5 A fuse</text>
<path d="M350 110 H1266 V800" class="pw"/>
<text x="1255" y="98" class="e r">+12 V rail to every pump</text>
<circle cx="430" cy="110" r="6" fill="#c0392b"/>
<line x1="430" y1="110" x2="430" y2="148" class="pw"/>
<rect x="360" y="148" width="190" height="44" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="455" y="178" class="c">buck 12 → 5 V</text>
<path d="M550 170 H590 V210" class="pw"/>
<text x="562" y="160" class="r">5 V</text>
<path d="M700 210 V176 M690 176 H710" class="pw"/>
<text x="714" y="190" class="r">3.3 V out: ADS1115, DS18B20, pull-ups</text>
<!-- supply 0 V to the star ground -->
<path d="M30 110 H14 V945 H905" class="gn"/>
<text x="22" y="170">0 V</text>

