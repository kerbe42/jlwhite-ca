<text x="750" y="668" class="e">GPIO23</text>
<text x="750" y="738" class="e">GPIO26</text>
<text x="750" y="808" class="e">GPIO27</text>
</g>
<!-- ESP32 GND to the star point -->
<line x1="700" y1="910" x2="700" y2="945" class="gn"/>
<circle cx="700" cy="945" r="9" class="dot"/>
<text x="714" y="934">star ground</text>

<!-- ADS1115 and I2C -->
<rect x="300" y="285" width="170" height="200" rx="8" class="box"/>
<text x="385" y="316" class="c b">ADS1115</text>
<text x="310" y="353">A0</text>
<text x="310" y="438">A1</text>
<text x="310" y="476">A2</text>
<text x="460" y="472" class="e m">0x48</text>
<path d="M385 285 V262 M375 262 H395" class="pw"/>
<text x="400" y="268" class="r">3.3 V</text>
<line x1="470" y1="345" x2="540" y2="345" class="i2"/>
<line x1="470" y1="390" x2="540" y2="390" class="i2"/>
<text x="480" y="337" style="fill:#2f6e22">SDA</text>
<text x="480" y="382" style="fill:#2f6e22">SCL</text>

<!-- pH board through the 10k/20k divider to A0 -->
<rect x="30" y="300" width="135" height="80" rx="8" class="box"/>
<text x="97" y="332" class="c b">pH-4502C</text>
<text x="97" y="362" class="c m">+ probe</text>
<path d="M97 300 V278 M87 278 H107" class="pw"/>
