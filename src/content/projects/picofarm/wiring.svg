<line x1="1190" y1="380" x2="1266" y2="380" class="pw"/>

<line x1="760" y1="450" x2="830" y2="450" class="sg"/><rect x="830" y="430" width="150" height="40" rx="7" class="box"/><text x="905" y="458" class="c">MOSFET</text>
<line x1="980" y1="450" x2="1030" y2="450" class="pu"/><rect x="1030" y="430" width="160" height="40" rx="7" fill="#fdf0e1" stroke="#d07a1a" stroke-width="2.5"/><text x="1110" y="458" class="c">pH Down</text>
