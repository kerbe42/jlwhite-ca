<line x1="410" y1="640" x2="540" y2="640" class="sg"/>

<text x="30" y="693">high-water float</text>
<path d="M350 685 V693 M338 693 H362 M342 698 H358 M346 703 H354" class="gs"/>
<line x1="350" y1="685" x2="370" y2="685" class="sg"/>
<circle cx="372" cy="685" r="3.5" class="dot"/><line x1="372" y1="685" x2="406" y2="671" class="gs"/><circle cx="410" cy="685" r="3.5" class="dot"/>
<line x1="410" y1="685" x2="540" y2="685" class="sg"/>

<text x="30" y="738">emergency float (sense)</text>
<path d="M350 730 V738 M338 738 H362 M342 743 H358 M346 748 H354" class="gs"/>
