<line x1="760" y1="520" x2="830" y2="520" class="sg"/><rect x="830" y="500" width="150" height="40" rx="7" class="box"/><text x="905" y="528" class="c">MOSFET</text>
<line x1="980" y1="520" x2="1030" y2="520" class="pu"/><rect x="1030" y="500" width="160" height="40" rx="7" fill="#fdf0e1" stroke="#d07a1a" stroke-width="2.5"/><text x="1110" y="528" class="c">Nutrient A</text>
<line x1="1190" y1="520" x2="1266" y2="520" class="pw"/>

<line x1="760" y1="590" x2="830" y2="590" class="sg"/><rect x="830" y="570" width="150" height="40" rx="7" class="box"/><text x="905" y="598" class="c">MOSFET</text>
<line x1="980" y1="590" x2="1030" y2="590" class="pu"/><rect x="1030" y="570" width="160" height="40" rx="7" fill="#fdf0e1" stroke="#d07a1a" stroke-width="2.5"/><text x="1110" y="598" class="c">Nutrient B</text>
<line x1="1190" y1="590" x2="1266" y2="590" class="pw"/>

<line x1="760" y1="660" x2="830" y2="660" class="sg"/><rect x="830" y="640" width="150" height="40" rx="7" class="box"/><text x="905" y="668" class="c">MOSFET</text>
<line x1="980" y1="660" x2="1030" y2="660" class="pu"/><rect x="1030" y="640" width="160" height="40" rx="7" fill="#fdf0e1" stroke="#d07a1a" stroke-width="2.5"/><text x="1110" y="668" class="c">Refill</text>
<line x1="1190" y1="660" x2="1202" y2="660" class="pw"/>
<circle cx="1205" cy="660" r="3.5" fill="#c0392b"/><line x1="1205" y1="660" x2="1240" y2="645" stroke="#c0392b" stroke-width="2.5"/><circle cx="1244" cy="660" r="3.5" fill="#c0392b"/>
