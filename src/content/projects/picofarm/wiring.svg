<line x1="905" y1="400" x2="905" y2="945" class="gn"/>
<g>
<line x1="760" y1="380" x2="830" y2="380" class="sg"/><rect x="830" y="360" width="150" height="40" rx="7" class="box"/><text x="905" y="388" class="c">MOSFET</text>
