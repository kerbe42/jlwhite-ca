<circle cx="372" cy="800" r="3.5" class="dot"/><line x1="372" y1="800" x2="406" y2="786" class="gs"/><circle cx="410" cy="800" r="3.5" class="dot"/>
<line x1="410" y1="800" x2="540" y2="800" class="sg"/>
<circle cx="470" cy="800" r="5" class="dot"/>
<path d="M470 800 V792 M470 768 V762 M460 762 H480" class="gs"/>
<rect x="462" y="768" width="16" height="24" class="res"/>
