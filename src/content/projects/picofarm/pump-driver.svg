<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="620" viewBox="0 0 1312 620" role="img" aria-labelledby="t d">
<title id="t">One PicoFarm pump driver channel</title>
<desc id="d">An ESP32 pin drives an AO3400A N-channel MOSFET gate through a 100 ohm resistor, with a 10k pull-down from gate to ground. The pump runs from +12 V to the MOSFET drain, a 1N5819 flyback diode sits across the pump with its cathode to +12 V, and the source goes to the star ground.</desc>
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-size:24px;fill:#2c2c2a}
.ti{font-family:Georgia,'Liberation Serif','Times New Roman',serif;font-size:34px}
.b{font-weight:700}
.m{fill:#5f5e5a}
.r{fill:#a8321f}
.c{text-anchor:middle}
.e{text-anchor:end}
.pw{stroke:#c0392b;stroke-width:4;fill:none}
.gn{stroke:#2c2c2a;stroke-width:4;fill:none}
.sg{stroke:#2f6690;stroke-width:3.5;fill:none}
.pu{stroke:#d07a1a;stroke-width:4;fill:none}
.k{stroke:#2c2c2a;stroke-width:3;fill:none}
.res{fill:#fff;stroke:#2c2c2a;stroke-width:3}
.dot{fill:#2c2c2a}
</style>
<rect width="1312" height="620" fill="#fbf7ef"/>
<text x="30" y="54" class="ti">One pump driver (seven per controller)</text>

<!-- +12 V rail -->
<line x1="400" y1="120" x2="760" y2="120" class="pw"/>
<text x="388" y="129" class="e r b">+12 V</text>

<!-- pump -->
<line x1="540" y1="120" x2="540" y2="170" class="pw"/>
<circle cx="540" cy="215" r="45" fill="#fdf0e1" stroke="#d07a1a" stroke-width="4"/>
<text x="540" y="226" class="c b" style="font-size:30px;fill:#a85c0e">M</text>
<text x="478" y="224" class="e" style="fill:#a85c0e">pump</text>
<line x1="540" y1="260" x2="540" y2="320" class="pu"/>

<!-- flyback diode, cathode to +12 V -->
<line x1="700" y1="120" x2="700" y2="186" class="pw"/>
<line x1="676" y1="188" x2="724" y2="188" class="k" style="stroke-width:4"/>
<path d="M676 236 L724 236 L700 190 Z" fill="#fff" stroke="#2c2c2a" stroke-width="3"/>
<line x1="700" y1="236" x2="700" y2="320" class="pu"/>
<line x1="540" y1="320" x2="700" y2="320" class="pu"/>
<circle cx="540" cy="320" r="6" class="dot"/>
<text x="740" y="208" class="b">1N5819</text>
<text x="740" y="238" class="m">flyback</text>

<!-- N-channel MOSFET -->
<line x1="540" y1="320" x2="540" y2="369" class="pu"/>
<line x1="500" y1="368" x2="500" y2="432" class="k" style="stroke-width:4"/>
<line x1="515" y1="358" x2="515" y2="380" class="k" style="stroke-width:4"/>
<line x1="515" y1="390" x2="515" y2="410" class="k" style="stroke-width:4"/>
<line x1="515" y1="420" x2="515" y2="442" class="k" style="stroke-width:4"/>
<path d="M515 369 H540 M515 431 H540 V520 M540 400 V431" class="k"/>
<line x1="540" y1="400" x2="530" y2="400" class="k"/>
<path d="M517 400 L531 392 L531 408 Z" class="dot"/>
<text x="566" y="392" class="b">AO3400A</text>
<text x="566" y="422" class="m">N-channel MOSFET</text>
<text x="552" y="356" class="m">drain</text>
<text x="552" y="476" class="m">source</text>

<!-- gate: pin, 100 ohm, 10k pull-down -->
<circle cx="200" cy="400" r="8" fill="#fff" stroke="#2f6690" stroke-width="3.5"/>
<text x="184" y="408" class="e b">ESP32 pin</text>
<line x1="208" y1="400" x2="290" y2="400" class="sg"/>
<rect x="290" y="390" width="64" height="20" class="res"/>
<text x="322" y="376" class="c">100 Ω</text>
<line x1="354" y1="400" x2="500" y2="400" class="sg"/>
<circle cx="420" cy="400" r="6" class="dot"/>
<line x1="420" y1="400" x2="420" y2="440" class="k"/>
<rect x="410" y="440" width="20" height="50" class="res"/>
<line x1="420" y1="490" x2="420" y2="520" class="k"/>
<text x="400" y="472" class="e">10 k</text>
<text x="462" y="388" class="c m">gate</text>

<!-- ground -->
<path d="M420 520 H540 M540 520 V548" class="gn"/>
<path d="M516 548 H564 M524 557 H556 M532 566 H548" class="k"/>
<text x="580" y="562" class="m">star ground</text>

<!-- notes -->
<g>
<circle cx="866" cy="150" r="7" fill="#d07a1a"/>
<text x="886" y="158">The AO3400A switches the pump's</text>
<text x="886" y="188">low side and is fully on at 3.3 V.</text>
<circle cx="866" cy="250" r="7" fill="#2c2c2a"/>
<text x="886" y="258">The 10 k pull-down holds the pump</text>
<text x="886" y="288">off while the ESP32 resets or boots.</text>
<circle cx="866" cy="350" r="7" fill="#c0392b"/>
<text x="886" y="358">The diode takes the motor's</text>
<text x="886" y="388">turn-off spike.</text>
<circle cx="866" cy="450" r="7" fill="#2f6690"/>
<text x="886" y="458">The firmware drives every pump</text>
<text x="886" y="488">pin off as its very first action.</text>
</g>
</svg>
